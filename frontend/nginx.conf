# Ghi log không kèm query string (BE-11): URL ký trước của CCCD/hợp đồng, ảnh chờ duyệt mang token trong query.
map $request_uri $uri_no_query {
    ~^(?<path>[^?]*)\?  "$path?[redacted]";
    default            $request_uri;
}
log_format main_redacted '$remote_addr - $remote_user [$time_local] "$request_method $uri_no_query $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;   # ảnh phòng ≤ 5 MB, file hợp đồng ≤ 10 MB
    access_log /var/log/nginx/access.log main_redacted;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Header bảo mật (BE-17). Lưu ý: add_header trong location sẽ thay toàn bộ header của server,
    # nên location nào có add_header riêng phải lặp lại các dòng này.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi đè (không nối thêm) để client không giả mạo IP, giới hạn đăng nhập theo IP mới đúng.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
